services:
  # PostgreSQL database with pgvector extension
  # This database stores users, files, chunks, and Q&A history
  - type: pserv
    name: knowledge-ask-db
    plan: free
    databaseName: knowledge_ask_db
    databaseUser: knowledge_ask_user
    region: oregon
    ipAllowList: []  # Allow connections from Render services only

  # Web API service
  - type: web
    name: knowledge-ask-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: knowledge-ask-db
          property: connectionString
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: CHUNK_SIZE
        value: 600
      - key: CHUNK_OVERLAP
        value: 100
      - key: TOP_K_CHUNKS
        value: 5
      # CORS: Allow requests from frontend
      - key: CORS_ORIGINS
        value: https://knowledge-ask-frontend.onrender.com,http://localhost:5174
    healthCheckPath: /health
